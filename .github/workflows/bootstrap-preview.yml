name: Bootstrap Hua Wealth Management Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download original HTML attachment
        env:
          SOURCE_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-f3fc-8230-9586-f8e2ac135034/raw?se=2026-09-08T23%3A02%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=f6615011-16bb-52eb-9051-7bf1bddbabab&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T19%3A24%3A47Z&ske=2026-09-09T19%3A24%3A47Z&sks=b&skv=2026-02-06&sig=BUzMdayWXMOwfsydbFbwW8JKYYZudhaYskih0TlU8z8%3D"
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" --output index.html
          test "$(wc -c < index.html)" -eq 563986
          grep -qi '<title>Hua Wealth Management' index.html

      - name: Save HTML to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add Hua Wealth Management preview [skip ci]"
            git push
          fi
